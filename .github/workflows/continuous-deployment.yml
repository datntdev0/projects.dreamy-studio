name: Continuous Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer and portable
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../_output/desktop/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm run build:installer

      - name: Build portable
        run: pnpm run build:portable

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dreamy-studio-installer
          path: _output/installer/*
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: dreamy-studio-portable
          path: _output/portable/*.zip
          if-no-files-found: error
