name: Continuous Deployment

on:
  workflow_dispatch:
    inputs:
      build_application:
        description: Build Application
        type: boolean
        default: true
      deploy_landing_page:
        description: Deploy Landing Page
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuous-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer and portable
    if: ${{ inputs.build_application }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../_output/desktop/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare build
        run: pnpm run build:prepare

      - name: Build installer
        run: pnpm run build:installer

      - name: Build portable
        run: pnpm run build:portable

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: dreamy-studio-installer
          path: _output/installer/*
          if-no-files-found: error

      - name: Upload portable
        uses: actions/upload-artifact@v7
        with:
          name: dreamy-studio-portable
          path: _output/portable/*.zip
          if-no-files-found: error

      - name: Publish release
        run: |
          $version = (Get-Content desktop/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $portable = Get-ChildItem _output/portable -Filter *.zip | Select-Object -First 1
          $hash = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content "$($portable.FullName).sha256" "$hash  $($portable.Name)" -NoNewline
          $assets = @(Get-ChildItem _output/installer -File) + @(Get-ChildItem _output/portable -File)
          $notesFile = ".github/releases/$tag.md"
          $notes = if (Test-Path $notesFile) { @('--notes-file', $notesFile) } else { @('--generate-notes') }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Dreamy Studio $version" --latest @notes
          } elseif (Test-Path $notesFile) {
            gh release edit $tag --notes-file $notesFile
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag $assets.FullName --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy-landing:
    name: Deploy landing page
    if: ${{ inputs.deploy_landing_page }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload landing page
        uses: actions/upload-pages-artifact@v5
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
