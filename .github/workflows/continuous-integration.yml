name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    name: Unit test
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../_output/desktop/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare sidecars
        run: pnpm run build:prepare

      - name: Test desktop
        run: pnpm run test

      - name: Test angular
        run: pnpm run angular:test

      - name: Install backend
        run: python -m pip install --disable-pip-version-check -e "backend[dev]"

      - name: Test backend
        run: python -m pytest backend/tests

  verify:
    name: Verify project
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> ../_output/desktop/target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare sidecars
        run: pnpm run build:prepare

      - name: Build app
        run: pnpm run verify:build

      - name: Verify project
        run: pnpm run verify:test

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dreamy-studio-verify-report
          path: _output/verify/report
          if-no-files-found: ignore
