# Product Vision for Dreamy Studio
# Breakline when the content exceeds the width of the page 100 characters

problem: >-
  Content creator gặp khó khăn khi biến tác phẩm văn học thành các sản phẩm giải trí sáng tạo vì
  quy trình sản xuất gồm nhiều công đoạn thủ công, lặp lại và các công cụ rời rạc hoặc đòi hỏi
  phần cứng mạnh. Trong bối cảnh làm việc trên máy tính cá nhân, cần kết hợp nhiều dịch vụ AI
  nhưng vẫn kiểm soát chi phí và dữ liệu cục bộ, họ mong muốn một studio tích hợp để quản lý và
  tự động hóa quy trình từ tiểu thuyết đến bản dịch, audiobook, hình minh họa và video hoàn chỉnh.

vision: >-
  Dreamy Studio hướng tới trở thành studio sáng tạo trên máy tính cá nhân, giúp content creator
  biến tác phẩm văn học thành các sản phẩm giải trí đa phương tiện một cách dễ tiếp cận, nhất
  quán và tiết kiệm chi phí.

success:
  - Hiện thực hóa ý tưởng từ tác phẩm văn học thành các sản phẩm phái sinh giải trí sáng tạo.
  - Giảm thao tác thủ công lặp lại trong quá trình sản xuất, tăng chất lượng sản phẩm tạo ra.
  - Giảm chi phí đầu tư ban đầu cho thiết bị phần cứng nhưng vẫn sản xuất được sản phẩm.

constraints:
  - Phần mềm chạy trên máy tính cá nhân dưới dạng desktop app.
  - Nội dung dự án chỉ được lưu trên máy tính của người dùng.
  - Một số chức năng cụ thể của phần mềm cần kết nối internet.

capabilities:
  - id: CAP-01
    name: Workspace Management
    description: >-
      Tổ chức và quản lý không gian làm việc cục bộ, bao gồm dữ liệu, cấu hình và các thành phần
      dùng chung của người dùng.

  - id: CAP-02
    name: Content Source Management
    description: >-
      Quản lý nội dung nguồn và cấu trúc của nội dung đó để làm đầu vào cho các hoạt động sáng tạo,
      phân tích và sản xuất.

  - id: CAP-03
    name: Content Translation
    description: >-
      Chuyển đổi, biên tập và duy trì các phiên bản dịch thuật của nội dung nguồn.

  - id: CAP-04
    name: Content Intelligence
    description: >-
      Trích xuất, tổ chức, kiểm chứng và khai thác tri thức từ nội dung để hỗ trợ hiểu, tìm kiếm và
      ra quyết định sáng tạo.

  - id: CAP-05
    name: Asset Library Management
    description: >-
      Lưu trữ, phân loại, tìm kiếm, xem trước và tái sử dụng các tài nguyên sáng tạo như hình ảnh,
      âm thanh, video, prompt,...

  - id: CAP-06
    name: Project Management
    description: >-
      Tạo, tổ chức và theo dõi dự án; liên kết nội dung, tài nguyên, quy trình và đầu ra thuộc từng
      dự án.

  - id: CAP-07
    name: Pre-Production
    description: >-
      Hỗ trợ chuẩn bị và định hình ý tưởng sản xuất, gồm phát triển nội dung, kịch bản, tham chiếu
      sáng tạo, phân cảnh và kế hoạch thực hiện.

  - id: CAP-08
    name: Production Workflow
    description: >-
      Cung cấp các mô-đun và workflow linh hoạt để tạo, xử lý, đánh giá và lặp lại các tài nguyên
      hoặc nội dung đa phương tiện.

  - id: CAP-09
    name: Post-Production
    description: >-
      Tổng hợp, biên tập, hoàn thiện, kiểm tra và xuất các sản phẩm đầu ra từ những tài nguyên đã
      được tạo trong dự án.

  - id: CAP-10
    name: Distribution
    description: >-
      Chuẩn bị, quản lý và đưa sản phẩm hoàn chỉnh đến các kênh hoặc nền tảng phân phối.

  - id: CAP-11
    name: Assistant
    description: >-
      Cung cấp hỗ trợ ngữ cảnh bằng AI cho việc phân tích, đề xuất, kiểm tra, tự động hóa tác vụ và
      điều khiển thao tác trong ứng dụng.

  - id: CAP-12
    name: Configuration
    description: >-
      Quản lý cấu hình ứng dụng, khả năng thực thi cục bộ, quyền truy cập và kết nối với model,
      provider, công cụ hoặc dịch vụ bên ngoài.

features:
  - id: FEAT-01
    name: Workspace Creation
    caps: [CAP-01]
    status: done
    description: >-
      Cho phép người dùng tạo workspace mới tại vị trí tự chọn trên máy tính. Hệ thống kiểm tra tên
      và đường dẫn, không ghi đè lên thư mục đã có, thiết lập cấu trúc thư mục và tệp cần thiết rồi
      thêm workspace vào danh sách gần đây; nếu tạo thất bại thì không để lại dữ liệu dở dang.

  - id: FEAT-02
    name: Workspace Deletion
    caps: [CAP-01]
    status: done
    description: >-
      Cho phép người dùng xóa workspace khỏi máy tính và danh sách gần đây sau khi xác nhận. Hộp
      thoại xác nhận nêu rõ workspace sắp xóa và việc xóa không thể hoàn tác; không cho phép xóa
      workspace đang được mở.

  - id: FEAT-03
    name: Workspace Opening
    caps: [CAP-01]
    status: done
    description: >-
      Cho phép người dùng mở workspace đã có bằng cách chọn thư mục trên máy tính hoặc từ danh sách
      gần đây. Hệ thống kiểm tra đường dẫn, quyền truy cập và cấu trúc workspace, chuẩn bị dữ liệu
      cần thiết trước khi vào không gian làm việc; nếu thất bại thì giữ nguyên trạng thái trước đó
      và báo lý do.

  - id: FEAT-04
    name: Novel Creation
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng tạo novel mới trong workspace bằng cách nhập tiêu đề (bắt buộc, tối đa
      200 ký tự), tên hiển thị, tác giả, ngôn ngữ nguồn, mô tả và tag. Novel mới chưa có chương và
      xuất hiện ngay trong danh sách novel.

  - id: FEAT-05
    name: Novel Package Import
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng nhập novel từ tệp package (.dsnovel hoặc .zip). Hệ thống kiểm tra tuần tự
      định dạng, manifest, danh sách chương và ảnh bìa, hiển thị tiến trình cùng tóm tắt nội dung
      package, cho phép chỉnh thông tin trước khi nhập và cảnh báo khi trùng tiêu đề; nếu nhập thất
      bại thì không để lại dữ liệu dở dang.

  - id: FEAT-06
    name: Novel Package Export
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng xuất novel thành tệp package .dsnovel để sao lưu hoặc chuyển sang
      workspace khác. Tên tệp được gợi ý từ tên novel; không cho xuất novel chưa có chương nào.

  - id: FEAT-07
    name: Novel Browsing
    caps: [CAP-02]
    status: done
    description: >-
      Hiển thị danh sách novel trong workspace dạng lưới hoặc bảng cùng số liệu thống kê (số novel,
      chương, từ, tiến độ dịch và phân tích). Người dùng tìm kiếm theo tiêu đề, tên hoặc tác giả,
      lọc theo tag và ngôn ngữ, và chọn nhiều novel để thao tác cùng lúc.

  - id: FEAT-08
    name: Novel Information Management
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng xem và chỉnh sửa thông tin novel gồm tiêu đề, tên hiển thị, tác giả,
      ngôn ngữ, mô tả, tag (tối đa 12 tag, mỗi tag tối đa 24 ký tự) và ảnh bìa (tối đa 8 MB).

  - id: FEAT-09
    name: Novel Deletion
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng xóa một hoặc nhiều novel khỏi workspace sau khi xác nhận. Hộp thoại xác
      nhận nêu rõ các novel sắp xóa và cảnh báo hậu quả của việc xóa.

  - id: FEAT-10
    name: Chapter Management
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng xem danh sách chương của novel kèm số từ, trạng thái dịch và phân tích,
      tìm kiếm theo số hoặc tiêu đề, thêm chương mới, đổi tên, sắp xếp lại thứ tự và xóa chương sau
      khi xác nhận. Chương đã có bản dịch hoặc kết quả phân tích bị khóa, không thể xóa hay di
      chuyển.

  - id: FEAT-11
    name: Novel Reading and Editing
    caps: [CAP-02]
    status: done
    description: >-
      Cho phép người dùng đọc nội dung novel theo chương và đoạn, chuyển chương, tùy chỉnh giao
      diện đọc (phông chữ, cỡ chữ, giãn dòng, độ rộng, màu nền), đồng thời sửa đoạn, thêm đoạn hoặc
      viết lại cả chương ngay trong trình đọc.

  - id: FEAT-12
    name: Asset Upload
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng tải ảnh (png, jpg, jpeg, webp, gif; tối đa 25 MB), âm thanh (mp3, wav,
      aac; tối đa 200 MB) và video (mp4, mov, webm, mkv; tối đa 2 GB) vào thư viện bằng hộp thoại
      chọn tệp hoặc kéo thả, cùng lúc nhiều tệp. Hệ thống kiểm tra từng tệp trước khi tải, yêu cầu
      chọn quyền sử dụng, cho gắn tag và bộ sưu tập, tự đổi tên khi trùng; tệp lỗi không làm hỏng
      các tệp còn lại và không để lại dữ liệu dở dang.

  - id: FEAT-13
    name: Prompt Authoring
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng thêm prompt vào thư viện bằng cách viết trực tiếp hoặc nhập từ tệp .txt,
      .md. Prompt có tên (bắt buộc, tối đa 120 ký tự), loại (hình ảnh, video, giọng đọc, chung) và
      nội dung không rỗng, tối đa 256 KB. Hệ thống nhận diện các biến dạng {{tên}} trong nội dung.

  - id: FEAT-14
    name: Asset Browsing
    caps: [CAP-05]
    status: done
    description: >-
      Hiển thị tài nguyên trong thư viện theo từng loại (ảnh, âm thanh, video, prompt) kèm số lượng.
      Người dùng tìm kiếm theo tên hoặc tag (prompt tìm cả trong nội dung), sắp xếp theo mới nhất,
      tên hoặc dung lượng, lọc theo tag và bộ sưu tập, và được hướng dẫn khi danh sách trống.

  - id: FEAT-15
    name: Asset Preview
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng xem trước tài nguyên mà không rời thư viện: ảnh phóng to kèm thông tin
      và chuyển ảnh liền kề, âm thanh có dạng sóng và điều khiển phát, video có ảnh poster và điều
      khiển phát, prompt có biến được tô nổi bật và nút sao chép nội dung để tái sử dụng.

  - id: FEAT-16
    name: Asset Information Management
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng chỉnh tên, quyền sử dụng (của tôi, có giấy phép, miễn phí, khác), bộ
      sưu tập và tag (tối đa 12 tag, mỗi tag tối đa 24 ký tự) của tài nguyên; với prompt còn sửa
      được loại và nội dung. Tên trùng được tự đánh số để không có hai tài nguyên cùng loại trùng
      tên.

  - id: FEAT-17
    name: Asset Deletion
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng xóa tài nguyên khỏi thư viện sau khi xác nhận. Hộp thoại xác nhận nêu rõ
      tài nguyên sắp xóa và việc xóa không thể hoàn tác; hủy thì không có gì thay đổi.

  - id: FEAT-18
    name: Collection Management
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng tạo, sửa và xóa bộ sưu tập để nhóm các tài nguyên thuộc nhiều loại. Tên
      bộ sưu tập bắt buộc, từ 1 đến 80 ký tự và không trùng (không phân biệt hoa thường); mô tả tối
      đa 500 ký tự. Mỗi bộ sưu tập hiển thị số tài nguyên theo loại; xóa bộ sưu tập không xóa tài
      nguyên bên trong mà đưa chúng về trạng thái chưa phân loại.

  - id: FEAT-19
    name: Tag Management
    caps: [CAP-05]
    status: done
    description: >-
      Cho phép người dùng xem toàn bộ tag đang dùng trong thư viện kèm số tài nguyên theo loại, tìm
      tag, đổi tên, hợp nhất vào tag khác và xóa tag trên mọi tài nguyên cùng lúc. Đổi tên sang tag
      đã có được xử lý như hợp nhất và cần xác nhận.

  - id: FEAT-20
    name: Translation Workspace
    caps: [CAP-03]
    status: done
    description: >-
      Cho phép người dùng mở không gian dịch của một novel, chọn ngôn ngữ đích (tiếng Việt hoặc
      tiếng Anh, khác ngôn ngữ của novel) và đi qua năm bước Từ điển, Hướng dẫn dịch, Dịch, Kết quả,
      Cảnh báo, mỗi bước có tóm tắt tiến độ. Novel chưa có chương hiển thị trạng thái trống.

  - id: FEAT-21
    name: Translation Dictionary
    caps: [CAP-03]
    status: done
    description: >-
      Cho phép người dùng quản lý từ điển dịch riêng cho từng novel và từng ngôn ngữ đích. Mỗi mục
      gồm thuật ngữ gốc, bản dịch (bắt buộc), loại (tên riêng, địa danh, tổ chức, chức danh, thuật
      ngữ) và ghi chú; thuật ngữ gốc không trùng trong cùng một ngôn ngữ đích. Hỗ trợ thêm, sửa
      trực tiếp, xóa và tìm kiếm.

  - id: FEAT-22
    name: Translation Guidelines
    caps: [CAP-03]
    status: done
    description: >-
      Cho phép người dùng soạn và lưu hướng dẫn dịch (văn phong, xưng hô, quy ước) riêng cho từng
      ngôn ngữ đích của novel để dùng cho mọi lần dịch.

  - id: FEAT-23
    name: Chapter Translation
    caps: [CAP-03]
    status: done
    description: >-
      Cho phép người dùng xem trạng thái từng chương (chưa dịch, hàng đợi, đang dịch, đã dịch) và
      dịch sang ngôn ngữ đích qua hộp thoại dịch (chương chưa dịch, khoảng chương hoặc tất cả).
      Tiến độ cập nhật realtime theo từng chương, có thể hủy khi đang chạy; chương đã dịch được dịch
      lại và giữ ghi chú đoạn; tác vụ lỗi hiển thị lý do và không ghi bản dịch dở dang.

  - id: FEAT-24
    name: Translation Review
    caps: [CAP-03]
    status: done
    description: >-
      Cho phép người dùng đối chiếu song song bản gốc và bản dịch theo chương, lọc các đoạn cần rà
      soát, sửa bản dịch từng đoạn (không được để trống), ghi chú cho đoạn, và chuyển từ chương
      chưa dịch sang hộp thoại dịch.

  - id: FEAT-25
    name: Translation Warnings
    caps: [CAP-03]
    status: done
    description: >-
      Tự phát hiện các đoạn dịch không dùng đúng bản dịch của thuật ngữ trong từ điển để rà soát.
      Cảnh báo lọc được, dẫn tới đoạn hoặc từ điển liên quan và tự biến mất khi vấn đề được xử lý.

  - id: FEAT-26
    name: Pipeline Monitoring
    caps: [CAP-03]
    status: done
    description: >-
      Cho phép người dùng theo dõi các pipeline xử lý nội dung (dịch, phân tích): lịch sử có tìm
      theo novel và lọc theo trạng thái, danh sách đang chạy với tiến độ từng tác vụ và nút hủy, nhật
      ký chi tiết, và chỉ báo chạy hoặc rảnh ở thanh trạng thái.

  - id: FEAT-27
    name: Knowledge Extraction
    caps: [CAP-04]
    status: done
    description: >-
      Cho phép người dùng phân tích chương của novel bằng provider đã cấu hình để trích xuất thực
      thể và fact kèm trích dẫn bằng chứng. Chọn phiên bản ngôn ngữ (bản gốc hoặc bản dịch đã có),
      phạm vi (chưa phân tích, khoảng chương, tất cả), ghi đè kết quả cũ; hệ thống chia lô tối đa 5
      chương, chạy như một pipeline phân tích và báo tiến độ số chương đã phân tích.

  - id: FEAT-28
    name: Knowledge Browsing
    caps: [CAP-04]
    status: done
    description: >-
      Cho phép người dùng khám phá tri thức của novel theo từng phiên bản ngôn ngữ qua đồ thị, danh
      sách thực thể (tìm theo tên, chức danh, bí danh; lọc theo loại, chương, xung đột) và bảng chi
      tiết kèm trích dẫn bằng chứng. Chế độ chống spoiler chỉ hiển thị tri thức xuất hiện đến chương
      đã chọn.

  - id: FEAT-29
    name: Knowledge Editing
    caps: [CAP-04]
    status: done
    description: >-
      Cho phép người dùng thêm, sửa, xóa và gộp thực thể, fact trong tri thức. Mỗi mục mới phải có ít
      nhất một trích dẫn tồn tại trong văn bản chương; tên thực thể bắt buộc; gộp chỉ áp dụng cho
      các thực thể cùng loại. Có xem trước trạng thái xung đột trước khi áp dụng và xác nhận trước
      khi xóa.

  - id: FEAT-30
    name: Knowledge Consistency Review
    caps: [CAP-04]
    status: done
    description: >-
      Tự kiểm tra tri thức bằng các quy tắc chạy bằng code, không dùng LLM: ràng buộc loại của
      quan hệ, liên kết nhân dạng, tham chiếu treo, trùng thực thể, bằng chứng không khớp văn bản và
      nguồn đã đổi sau khi phân tích. Xung đột lọc được theo quy tắc và có thao tác sửa nhanh (gộp,
      chuyển nhân dạng, tạo nhân vật, xóa, giữ nguyên, phân tích lại).

  - id: FEAT-31
    name: Project Creation
    caps: [CAP-06]
    status: done
    description: >-
      Cho phép người dùng tạo project mới trong workspace từ một template (audiobook, filmseries
      hoặc dự án trống). Tên project bắt buộc; mô tả tùy chọn. Project có thể gắn với một novel,
      chọn phiên bản văn bản (hiện là bản gốc) và khoảng chương, trong phạm vi số chương của
      novel. Mỗi project có thư mục riêng đặt theo id; nếu tạo thất bại thì không để lại dữ liệu dở
      dang.

  - id: FEAT-32
    name: Project Browsing
    caps: [CAP-06]
    status: done
    description: >-
      Hiển thị danh mục project dạng lưới hoặc bảng kèm số lượng theo loại và trạng thái. Người
      dùng tìm theo tên hoặc mô tả, sắp xếp theo gần nhất hoặc tên, lọc theo loại và trạng thái
      (đang làm, lưu trữ), xem nhanh thông tin project ở bảng chi tiết và mở project; project đã
      lưu trữ xếp sau, danh sách trống hoặc không khớp bộ lọc có hướng dẫn.

  - id: FEAT-33
    name: Project Information Management
    caps: [CAP-06]
    status: done
    description: >-
      Cho phép người dùng đổi tên và mô tả project (tên không được để trống), đổi hoặc xóa ảnh bìa,
      lưu trữ project để ẩn khỏi các bộ lọc thường dùng và khôi phục lại. Thư mục project không đổi
      khi đổi tên; project gắn với đúng phiên bản văn bản đã chọn khi tạo và hiển thị rõ khi novel
      nguồn đã bị xóa.

  - id: FEAT-34
    name: Project Deletion
    caps: [CAP-06]
    status: done
    description: >-
      Cho phép người dùng xóa project đang chọn sau khi xác nhận. Hộp thoại nêu rõ project
      sắp xóa, cảnh báo thư mục project và mọi thứ bên trong bị xóa khỏi máy tính và không thể hoàn
      tác, đồng thời nêu rõ tài nguyên trong thư viện và novel nguồn không bị ảnh hưởng.

  - id: FEAT-35
    name: Project Folder Browsing
    caps: [CAP-06]
    status: done
    description: >-
      Cho phép người dùng xem cây thư mục của project ngay trong ứng dụng (thư mục xếp trước, làm
      mới được) và mở thư mục project bằng trình quản lý tệp của hệ điều hành.

  - id: FEAT-36
    name: Assistant Sessions
    caps: [CAP-11]
    status: done
    description: >-
      Cho phép người dùng mở phiên chat mới với Assistant trong phạm vi toàn workspace hoặc một
      novel, đổi phạm vi khi bắt đầu, xem lịch sử chat (tìm theo nội dung, lọc theo phạm vi, nhóm
      theo thời gian), mở lại phiên cũ để tiếp tục và xóa phiên sau khi xác nhận. Phiên được lưu
      trong workspace; xóa phiên không hoàn tác các chỉnh sửa đã áp dụng vào novel.

  - id: FEAT-37
    name: Assistant Q&A
    caps: [CAP-11]
    status: done
    description: >-
      Cho phép người dùng đặt câu hỏi cho Assistant về novel, chương, bản dịch, từ điển và tri thức
      trong phạm vi của phiên. Assistant chạy qua provider đã cấu hình cho chức năng Trợ lý, chỉ đọc
      dữ liệu workspace qua các công cụ cục bộ, hiển thị trạng thái đang trả lời cùng số thao tác đã
      chạy; lỗi gửi tin nhắn được báo rõ kèm lý do.

  - id: FEAT-38
    name: Assistant Editing Permission
    caps: [CAP-11]
    status: done
    description: >-
      Mặc định Assistant chỉ đọc. Người dùng bật quyền chỉnh sửa riêng cho từng phiên sau khi xác
      nhận cảnh báo; khi được bật, Assistant có thể sửa thông tin novel, chương và tri thức theo
      lệnh, dữ liệu liên quan trong ứng dụng được làm mới, và người dùng tắt lại quyền bất kỳ lúc
      nào.

  - id: FEAT-39
    name: Assistant Translation Review
    caps: [CAP-11]
    status: done
    description: >-
      Cho phép người dùng nhờ Assistant rà soát một chương đã dịch về tên riêng, từ điển, nghĩa, câu
      bị sót và văn phong. Kết quả là các vấn đề phân theo mức độ kèm đoạn hiện tại và đề xuất sửa,
      hoặc đề xuất thêm vào từ điển; người dùng áp dụng hoặc bỏ qua từng đề xuất hay tất cả, đề xuất
      không còn áp dụng được sẽ được báo rõ.

  - id: FEAT-40
    name: Assistant Knowledge Fixes
    caps: [CAP-11]
    status: done
    description: >-
      Cho phép người dùng nhờ Assistant đề xuất cách sửa các xung đột trong tri thức của novel.
      Đề xuất gồm nhiều thao tác (gộp, đổi tên, đổi loại, thêm hoặc xóa thực thể và fact, thuộc
      tính, bằng chứng) được kiểm tra cùng nhau với ontology và quy tắc nhất quán trước khi áp dụng
      một lần; người dùng xem trước số xung đột được giải quyết hoặc phát sinh rồi áp dụng hoặc bỏ
      qua.

  - id: FEAT-41
    name: General Settings
    caps: [CAP-12]
    status: done
    description: >-
      Cho phép người dùng mở hộp thoại Cài đặt để đổi ngôn ngữ giao diện và giao diện sáng hoặc
      tối, áp dụng ngay và đồng bộ với nút đổi giao diện trên thanh tiêu đề. Cài đặt được lưu khi
      thay đổi, chỉ nằm trên máy này, và người dùng mở nhanh thư mục workspace hoặc thư mục dữ liệu
      ứng dụng.

  - id: FEAT-42
    name: LLM CLI Providers
    caps: [CAP-12]
    status: done
    description: >-
      Cho phép người dùng kết nối các CLI LLM đã cài trên máy. Ứng dụng tự quét CLI khi mở
      workspace, cho nhập đường dẫn thủ công, chạy mỗi CLI trong profile đăng nhập riêng của ứng
      dụng, hướng dẫn đăng nhập hoặc đăng xuất, kiểm tra kết nối và hiển thị trạng thái (chưa cài,
      chưa đăng nhập, sẵn sàng, lỗi). Dịch vụ cloud dùng API key chưa được hỗ trợ.

  - id: FEAT-43
    name: LLM Feature Configuration
    caps: [CAP-12]
    status: done
    description: >-
      Cho phép người dùng chọn provider, model, mức effort (thấp, trung bình, cao) và tham số bổ
      sung riêng cho từng chức năng dùng LLM (dịch thuật, tri thức, trợ lý). Chỉ liệt kê CLI hỗ trợ
      chức năng đó; để trống thì dùng mặc định của CLI.

  - id: FEAT-44
    name: Pipeline Concurrency Settings
    caps: [CAP-12]
    status: done
    description: >-
      Cho phép người dùng cấu hình số pipeline chạy đồng thời (1-5) và số task chạy song song trên
      toàn ứng dụng (1-10). Pipeline hoặc task vượt giới hạn chờ trong hàng đợi; giá trị áp dụng
      cho các lần chạy tiếp theo.
