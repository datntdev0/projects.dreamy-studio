# User Stories for CAP-08 Production Workflow
# Breakline when the content exceeds the width of the page 100 characters

cap: CAP-08

stories:
  # FEAT-57 Audiobook Voice Casting
  - id: US-0155
    feat: FEAT-57
    story: >-
      Là một content creator, tôi muốn gán giọng đọc trong thư viện cho người kể và từng nhân vật để
      audiobook có giọng phù hợp.
    acceptance:
      - given: Tôi mở Audiobook và chuyển sang chế độ Voices.
        when: Tôi xem bảng người nói và giọng đọc.
        then: >-
          Mỗi người kể và nhân vật có một dòng gồm tên, giọng, tốc độ, số block sử dụng và trạng
          thái.
      - given: Tôi mở danh sách giọng của một người nói.
        when: Tôi xem các lựa chọn.
        then: >-
          Giọng được nhóm theo Local TTS và Cloud speech kèm ngôn ngữ, giới tính; giọng chưa dùng
          được vẫn chọn được nhưng ghi rõ lý do.
      - given: Tôi chọn giọng cho một người nói.
        when: Lựa chọn thay đổi.
        then: Giọng được lưu ngay và mọi đoạn đã tạo của người nói đó được đánh dấu giọng đã đổi.
      - given: Người nói chưa có giọng.
        when: Tôi xem trạng thái.
        then: Trạng thái là chưa có giọng nếu đang được dùng, hoặc chưa dùng nếu không có block nào.

  - id: US-0156
    feat: FEAT-57
    story: >-
      Là một content creator, tôi muốn chỉnh tốc độ đọc của từng người nói để nhịp đọc khớp với
      tính cách nhân vật.
    acceptance:
      - given: Tôi đang ở chế độ Voices.
        when: Tôi nhập tốc độ cho một người nói.
        then: >-
          Tốc độ được giới hạn từ 0,6 đến 1,5 theo bước 0,05; giá trị 0 hoặc không hợp lệ trở về 1.
      - given: Người nói đã có đoạn được tạo.
        when: Tôi đổi tốc độ.
        then: Các đoạn đó được đánh dấu thiết lập giọng đã đổi.

  - id: US-0157
    feat: FEAT-57
    story: >-
      Là một content creator, tôi muốn nghe thử giọng đã gán để chắc giọng hợp với nhân vật trước
      khi tạo audio.
    acceptance:
      - given: Giọng của người nói dùng được.
        when: Tôi bấm nghe thử.
        then: Câu mẫu của giọng được phát; nếu giọng không có câu mẫu thì dùng câu mẫu mặc định.
      - given: Giọng là giọng cloud.
        when: Tôi bấm nghe thử.
        then: Hệ thống cảnh báo câu mẫu sẽ được gửi tới provider.
      - given: Giọng chưa dùng được hoặc chưa chọn giọng.
        when: Tôi xem nút nghe thử.
        then: Nút nghe thử bị khóa.
      - given: Nghe thử thất bại.
        when: Tôi xem kết quả.
        then: Hệ thống báo không phát được giọng nghe thử.

  - id: US-0158
    feat: FEAT-57
    story: >-
      Là một content creator, tôi muốn biết engine nào đã sẵn sàng ngay trong Audiobook để xử lý
      giọng chưa dùng được.
    acceptance:
      - given: Tôi đang ở chế độ Voices.
        when: Tôi xem bảng bên phải.
        then: >-
          Tôi thấy số model Local TTS đã cài và số provider cloud đã kết nối, hoặc chưa cài, chưa
          kết nối.
      - given: Tôi đang ở chế độ Voices.
        when: Tôi bấm Local TTS, Cloud speech hoặc Voice library.
        then: Cài đặt mở đúng mục Local backend hoặc Cloud providers, hoặc mục Giọng đọc mở ra.
      - given: Giọng của một người nói chưa dùng được.
        when: Tôi xem trạng thái.
        then: >-
          Trạng thái là chưa kết nối với giọng cloud, hoặc cần model với giọng cục bộ khi chưa cài
          model; trạng thái chạy của backend không được kiểm tra trước.

  - id: US-0159
    feat: FEAT-57
    story: >-
      Là một content creator, tôi muốn thêm người nói và thấy lời thoại chưa gán nhân vật để không
      đoạn nào bị đọc sai giọng.
    acceptance:
      - given: Tôi đang ở chế độ Voices.
        when: Tôi nhập tên người nói mới rồi bấm thêm hoặc nhấn Enter.
        then: >-
          Người nói được thêm vào danh sách nhân vật dùng chung với Scripting; tên trùng thì hệ
          thống báo đã tồn tại.
      - given: Người nói là người kể, nhân vật từ tri thức hoặc đang được dùng.
        when: Tôi xem nút xóa.
        then: Nút xóa bị khóa kèm lý do.
      - given: Tôi xóa một người nói chưa dùng.
        when: Việc xóa hoàn tất.
        then: Người nói và thiết lập giọng của họ bị xóa.
      - given: Project có lời thoại chưa gán nhân vật.
        when: Tôi xem chế độ Voices.
        then: Hệ thống báo số lời thoại chưa gán nhân vật kèm nút mở Scripting.

  # FEAT-58 Audiobook Segment Review
  - id: US-0160
    feat: FEAT-58
    story: >-
      Là một content creator, tôi muốn kịch bản được chia thành các đoạn đọc theo chương để theo dõi
      audio của từng câu.
    acceptance:
      - given: Chương có kịch bản.
        when: Tôi mở chương ở chế độ Production.
        then: >-
          Mỗi block tiêu đề, lời kể và lời thoại có nội dung trở thành một đoạn; ngắt nghỉ hiển thị
          số giây; ghi chú bị ẩn.
      - given: Tôi đang xem danh sách đoạn.
        when: Tôi xem một đoạn.
        then: >-
          Đoạn có số thứ tự, loại, người nói, giọng kèm tốc độ khi khác 1, sắc thái, nội dung,
          thời lượng và trạng thái chưa tạo, đã tạo, cần tạo lại, lỗi hoặc đang tạo.
      - given: Tiêu đề và lời kể.
        when: Tôi xem người nói của đoạn.
        then: Người nói là người kể; lời thoại dùng nhân vật đã gán trong Scripting.
      - given: Chương chưa có kịch bản.
        when: Tôi mở chương.
        then: Hệ thống nhắc viết kịch bản trong Scripting trước kèm nút mở Scripting.
      - given: Chương có kịch bản nhưng không có lời kể hay lời thoại.
        when: Tôi mở chương.
        then: Hệ thống báo không có đoạn nào để đọc.

  - id: US-0161
    feat: FEAT-58
    story: >-
      Là một content creator, tôi muốn xem tiến độ audio theo chương để biết chương nào còn phải
      tạo hoặc rà soát.
    acceptance:
      - given: Tôi mở Audiobook.
        when: Tôi xem danh sách chương.
        then: >-
          Tôi thấy số chương đã tạo xong trên tổng kèm thanh tiến độ; mỗi chương có số đoạn đã tạo
          trên tổng, thời lượng và trạng thái chưa tạo, đang làm, đã tạo hoặc cần rà soát.
      - given: Tôi mở Audiobook.
        when: Module tải xong.
        then: Chương đầu tiên có kịch bản nhưng chưa tạo xong audio được mở sẵn.
      - given: Tôi đang xem một chương.
        when: Tôi xem thanh thông tin chương.
        then: >-
          Tôi thấy số đoạn, số đã tạo, số cần tạo hoặc đang tạo và thời lượng ước tính gồm khoảng
          lặng.

  - id: US-0162
    feat: FEAT-58
    story: >-
      Là một content creator, tôi muốn biết đoạn nào cần tạo lại sau khi kịch bản hoặc giọng thay
      đổi để audio luôn khớp kịch bản.
    acceptance:
      - given: Đoạn đã tạo audio.
        when: Tôi sửa nội dung, người nói hoặc sắc thái trong Scripting.
        then: >-
          Đoạn chuyển sang cần tạo lại kèm lý do nội dung đã đổi, nhân vật đã đổi hoặc sắc thái
          đã đổi.
      - given: Đoạn đã tạo audio.
        when: Tôi đổi giọng hoặc tốc độ của người nói.
        then: Đoạn chuyển sang cần tạo lại kèm lý do giọng đã đổi hoặc thiết lập giọng đã đổi.
      - given: Chương có đoạn cần tạo lại.
        when: Tôi xem chương.
        then: Hệ thống báo số đoạn đã thay đổi kể từ khi tạo audio.
      - given: Tôi xóa block hoặc đổi block sang ngắt nghỉ, ghi chú.
        when: Tôi xem Audiobook.
        then: Đoạn tương ứng không còn trong danh sách.
      - given: Tôi đang xem một đoạn.
        when: Tôi bấm sửa trong Scripting.
        then: Scripting mở đúng chương và chọn sẵn block của đoạn đó.

  - id: US-0163
    feat: FEAT-58
    story: >-
      Là một content creator, tôi muốn được báo các vấn đề chặn việc tạo audio để xử lý trước khi
      tạo.
    acceptance:
      - given: Chương có lời thoại chưa gán nhân vật.
        when: Tôi xem chương.
        then: Hệ thống báo số lời thoại chưa gán kèm nút sửa trong Scripting dẫn tới block đầu tiên.
      - given: Một người nói trong chương chưa có giọng.
        when: Tôi xem chương.
        then: Hệ thống báo người nói chưa có giọng kèm nút chọn giọng mở chế độ Voices.
      - given: Giọng của một người nói chưa dùng được.
        when: Tôi xem chương.
        then: >-
          Hệ thống báo giọng chưa dùng được vì cần cài model hoặc cần kết nối provider, kèm nút
          đổi giọng.
      - given: Chương còn vấn đề chặn.
        when: Tôi xem nút tạo tất cả.
        then: Nút bị khóa.
      - given: Giọng cục bộ đã cài model nhưng backend cục bộ đang tắt.
        when: Tôi xem chương.
        then: >-
          Hệ thống không báo vấn đề chặn vì không kiểm tra backend trước khi tạo; lỗi của backend
          chỉ được báo khi tạo audio.

  - id: US-0164
    feat: FEAT-58
    story: >-
      Là một content creator, tôi muốn đánh dấu đoạn đọc lỗi kèm ghi chú để nhớ sửa và tạo lại.
    acceptance:
      - given: Đoạn đã có audio và chưa bị đánh dấu.
        when: Tôi bấm đánh dấu lỗi.
        then: Hộp thoại mở cho tôi ghi chú lỗi như sai trọng âm tên riêng hoặc ngắt quá nhanh.
      - given: Hộp thoại đánh dấu đang mở.
        when: Tôi xác nhận.
        then: >-
          Đoạn chuyển sang lỗi kèm ghi chú, ghi chú trống được thay bằng cần nghe lại, và hệ thống
          thông báo đã đánh dấu.
      - given: Đoạn đã bị đánh dấu lỗi.
        when: Tôi bấm bỏ đánh dấu.
        then: Đánh dấu được gỡ ngay.
      - given: Đoạn chưa có audio hoặc đang tạo.
        when: Tôi xem nút đánh dấu.
        then: Nút bị khóa.

  # FEAT-59 Audiobook Generation
  - id: US-0165
    feat: FEAT-59
    story: >-
      Là một content creator, tôi muốn tạo audio cho cả chương và biết trước chi phí, nơi xử lý để
      kiểm soát chi phí và dữ liệu.
    acceptance:
      - given: Chương có kịch bản, không còn vấn đề chặn và còn đoạn chưa tạo xong.
        when: Tôi bấm tạo tất cả.
        then: >-
          Hộp thoại nêu số đoạn sẽ tạo gồm đoạn chưa tạo, cần tạo lại và lỗi, đoạn đã tạo không
          đổi được giữ.
      - given: Hộp thoại tạo audio đang mở.
        when: Tôi xem các nhóm.
        then: >-
          Đoạn được nhóm theo Local TTS chạy trên máy kèm số ký tự, và từng provider cloud kèm cảnh
          báo văn bản được gửi tới provider và chi phí ước tính.
      - given: Hộp thoại tạo audio đang mở.
        when: Tôi xem chi phí ước tính.
        then: >-
          Chi phí chỉ tính cho provider trả phí theo số ký tự; nếu không có thì hiển thị không có
          chi phí trực tiếp, kèm ghi chú tiến độ được theo dõi trong Pipelines.
      - given: Mọi đoạn trong chương đã tạo xong hoặc đang tạo.
        when: Tôi xem nút tạo tất cả.
        then: Nút bị khóa.

  - id: US-0166
    feat: FEAT-59
    story: >-
      Là một content creator, tôi muốn việc tạo audio chạy như một pipeline để theo dõi, hủy và
      biết khi nào mọi đoạn của chương hoàn thành.
    acceptance:
      - given: Tôi xác nhận tạo audio.
        when: Việc tạo bắt đầu.
        then: >-
          Hệ thống tạo một pipeline audiobook gồm một task cho mỗi đoạn cần tạo, thông báo đã bắt
          đầu, các đoạn chuyển sang đang tạo và thanh thông tin hiển thị số đoạn đang tạo.
      - given: Pipeline audiobook đang chạy.
        when: Tôi mở Pipelines.
        then: >-
          Pipeline xuất hiện trong danh sách đang chạy kèm tiến độ từng task, nhật ký và nút hủy;
          thanh trạng thái báo đang chạy.
      - given: Số pipeline hoặc task đang chạy đã đạt giới hạn trong Cài đặt.
        when: Tôi bắt đầu tạo audio.
        then: Pipeline hoặc task mới chờ trong hàng đợi và tự chạy khi còn chỗ.
      - given: Pipeline audiobook đang chạy.
        when: Tôi chuyển sang chương khác.
        then: Pipeline tiếp tục chạy.
      - given: Pipeline audiobook đang chạy.
        when: Tôi hủy pipeline.
        then: >-
          Các task chưa xong dừng lại, đoạn đã tạo xong được giữ và các đoạn còn lại trở về trạng
          thái trước khi tạo.
      - given: Mọi task thành công.
        when: Pipeline kết thúc.
        then: Hệ thống thông báo hoàn thành, các đoạn chuyển sang đã tạo và cờ lỗi được gỡ.

  - id: US-0167
    feat: FEAT-59
    story: >-
      Là một content creator, tôi muốn được báo lỗi do backend trả về khi tạo audio để biết cần xử
      lý gì mà không bị chặn bởi bước kiểm tra trước.
    acceptance:
      - given: Chương không còn vấn đề chặn.
        when: Tôi tạo audio bằng giọng cục bộ.
        then: >-
          Ứng dụng gọi trực tiếp backend để tạo audio, không kiểm tra trước trạng thái chạy của
          backend.
      - given: Backend trả lỗi khi tạo một đoạn, ví dụ backend đang tắt.
        when: Task của đoạn đó thất bại.
        then: >-
          Hệ thống hiện toast lỗi kèm lý do backend trả về, task được đánh dấu thất bại trong
          pipeline và đoạn giữ trạng thái trước khi tạo.
      - given: Pipeline có task thất bại.
        when: Pipeline kết thúc.
        then: Hệ thống cảnh báo không tạo được mọi đoạn kèm số đoạn thất bại.

  - id: US-0168
    feat: FEAT-59
    story: >-
      Là một content creator, tôi muốn tạo lại riêng một đoạn để sửa nhanh câu đọc chưa đạt.
    acceptance:
      - given: Đoạn không đang tạo và chương không còn vấn đề chặn.
        when: Tôi bấm tạo lại.
        then: Đoạn chuyển sang đang tạo rồi đã tạo.
      - given: Chương còn vấn đề chặn.
        when: Tôi bấm tạo lại một đoạn.
        then: Hệ thống cảnh báo vấn đề chặn đầu tiên và không tạo.
      - given: Backend trả lỗi khi tạo lại đoạn.
        when: Việc tạo lại thất bại.
        then: Hệ thống hiện toast lỗi kèm lý do và đoạn giữ trạng thái trước khi tạo lại.

  # FEAT-60 Audiobook Playback
  - id: US-0169
    feat: FEAT-60
    story: >-
      Là một content creator, tôi muốn nghe từng đoạn hoặc cả chương để kiểm tra chất lượng audio.
    acceptance:
      - given: Đoạn đã có audio.
        when: Tôi bấm phát đoạn.
        then: >-
          Đoạn được phát, dòng đoạn hiển thị tiến độ; bấm lại thì tạm dừng hoặc tiếp tục, bấm đoạn
          khác thì chuyển sang đoạn đó.
      - given: Chương có đoạn đã có audio.
        when: Tôi bấm nghe cả chương.
        then: Các đoạn có audio được phát theo thứ tự xen kẽ các ngắt nghỉ của kịch bản.
      - given: Chương chưa có đoạn nào có audio.
        when: Tôi bấm nghe cả chương.
        then: Hệ thống báo chương chưa có audio để nghe.
      - given: Đang phát audio.
        when: Tôi xem thanh phát.
        then: >-
          Tôi thấy nút phát hoặc tạm dừng, tiêu đề đoạn, thanh tiến độ, thời gian đã phát trên tổng
          và nút dừng; thanh phát ẩn khi phát hết hoặc khi dừng.
      - given: Đoạn chưa có audio.
        when: Tôi xem nút phát của đoạn.
        then: Nút phát bị khóa.

  # FEAT-61 Audiobook Chapter Assembly and Export
  - id: US-0170
    feat: FEAT-61
    story: >-
      Là một content creator, tôi muốn chỉnh khoảng lặng và âm lượng của chương để audiobook có nhịp
      và độ lớn đồng đều.
    acceptance:
      - given: Chương có kịch bản.
        when: Tôi xem bảng chi tiết chương.
        then: >-
          Tôi thấy chương, số đoạn, số đã tạo, số cần xử lý, thời lượng audio và các thiết lập ghép
          chương.
      - given: Tôi đang chỉnh thiết lập ghép chương.
