# User Stories for CAP-11 Assistant
# Breakline when the content exceeds the width of the page 100 characters

cap: CAP-11

stories:
  # FEAT-36 Assistant Sessions
  - id: US-0101
    feat: FEAT-36
    story: >-
      Là một content creator, tôi muốn mở phiên chat mới và chọn phạm vi để Assistant chỉ làm việc
      trên phần tôi quan tâm.
    acceptance:
      - given: Workspace có novel.
        when: Tôi mở phiên chat mới.
        then: >-
          Tôi thấy lựa chọn toàn workspace kèm số novel và từng novel kèm số chương; chọn một novel
          thì thấy thêm số chương đã dịch và đã phân tích.
      - given: Danh sách phạm vi đang mở.
        when: Tôi tìm novel theo tên.
        then: Chỉ novel khớp được hiển thị; nếu không khớp, hệ thống báo không có novel nào khớp.
      - given: Tôi đã chọn phạm vi.
        when: Tôi gửi tin nhắn đầu tiên.
        then: Phiên chat được tạo và phạm vi hiển thị trên phiên.
      - given: Tôi chưa gửi tin nhắn đầu tiên của phiên mới.
        when: Tôi bấm đổi phạm vi.
        then: Tôi chọn lại được phạm vi; phiên đã có tin nhắn thì không đổi phạm vi mà mở phiên mới.

  - id: US-0102
    feat: FEAT-36
    story: >-
      Là một content creator, tôi muốn xem lại và tiếp tục các phiên chat cũ để không phải hỏi lại
      từ đầu.
    acceptance:
      - given: Đã có phiên chat.
        when: Tôi mở lịch sử chat.
        then: >-
          Phiên chat nhóm theo hôm nay, hôm qua, 7 ngày qua và cũ hơn, kèm phạm vi và số tin nhắn.
      - given: Lịch sử có nhiều phiên.
        when: Tôi tìm theo nội dung hoặc lọc theo phạm vi.
        then: >-
          Chỉ phiên khớp được hiển thị; nếu không khớp, hệ thống báo không có phiên nào và có nút
          xóa bộ lọc.
      - given: Tôi chọn một phiên trong lịch sử.
        when: Phiên mở ra.
        then: Toàn bộ tin nhắn trước đó hiển thị và tôi gửi tiếp được.
      - given: Chưa có phiên chat nào.
        when: Tôi mở lịch sử chat.
        then: Hệ thống hiển thị trạng thái trống giải thích phiên sẽ được lưu ở đây.

  - id: US-0103
    feat: FEAT-36
    story: >-
      Là một content creator, tôi muốn xóa phiên chat không cần nữa mà không ảnh hưởng đến dữ liệu
      tôi đã sửa.
    acceptance:
      - given: Tôi chọn xóa một phiên chat.
        when: Hộp thoại xác nhận mở.
        then: >-
          Hộp thoại nêu phạm vi, số tin nhắn và cảnh báo tin nhắn bị xóa vĩnh viễn nhưng các chỉnh
          sửa đã áp dụng vào novel không bị ảnh hưởng.
      - given: Hộp thoại xác nhận đang mở.
        when: Tôi hủy.
        then: Phiên chat giữ nguyên.
      - given: Hộp thoại xác nhận đang mở.
        when: Tôi xác nhận xóa.
        then: Phiên biến mất khỏi lịch sử và hệ thống thông báo đã xóa.

  # FEAT-37 Assistant Q&A
  - id: US-0104
    feat: FEAT-37
    story: >-
      Là một content creator, tôi muốn hỏi Assistant về nội dung workspace để nắm nhanh thông tin mà
      không phải tự tìm.
    acceptance:
      - given: Provider cho chức năng Trợ lý đã sẵn sàng.
        when: Tôi gửi một câu hỏi bằng Enter.
        then: Tin nhắn của tôi hiển thị ngay và có chỉ báo Assistant đang trả lời.
      - given: Assistant đang trả lời.
        when: Assistant đọc dữ liệu workspace để trả lời.
        then: Chỉ báo hiển thị đang tìm trong workspace và câu trả lời có số thao tác đã chạy.
      - given: Tôi đang soạn tin nhắn.
        when: Tôi nhấn Shift+Enter.
        then: Tin nhắn xuống dòng và chưa được gửi.
      - given: Phiên ở phạm vi một novel.
        when: Tôi hỏi về chương, bản dịch, từ điển hoặc tri thức của novel đó.
        then: Assistant trả lời dựa trên dữ liệu của novel.

  - id: US-0105
    feat: FEAT-37
    story: >-
      Là một content creator, tôi muốn biết rõ khi Assistant không trả lời được để xử lý hoặc thử
      lại.
    acceptance:
      - given: Chưa chọn provider cho chức năng Trợ lý hoặc provider chưa sẵn sàng.
        when: Tôi gửi tin nhắn.
        then: Hệ thống báo không gửi được kèm lý do và tôi đóng được thông báo.
      - given: Tải lịch sử chat thất bại.
        when: Tôi xem danh sách lịch sử.
        then: Hệ thống báo lỗi kèm lý do và nút thử lại.
      - given: Mở một phiên chat thất bại.
        when: Tôi chọn phiên đó.
        then: Hệ thống báo lỗi kèm lý do.

  # FEAT-38 Assistant Editing Permission
  - id: US-0106
    feat: FEAT-38
    story: >-
      Là một content creator, tôi muốn Assistant mặc định chỉ đọc để dữ liệu không bị đổi ngoài ý
      muốn.
    acceptance:
      - given: Tôi đã gửi tin nhắn đầu tiên của phiên chat mới.
        when: Tôi xem nút chỉnh sửa của phiên.
        then: Phiên ở chế độ chỉ đọc.
      - given: Phiên ở chế độ chỉ đọc.
        when: Tôi ra lệnh Assistant sửa novel, chương hoặc tri thức.
        then: Dữ liệu giữ nguyên.

  - id: US-0107
    feat: FEAT-38
    story: >-
      Là một content creator, tôi muốn cho phép Assistant chỉnh sửa theo từng phiên để giao việc sửa
      dữ liệu khi tôi tin tưởng.
    acceptance:
      - given: Phiên đang chỉ đọc.
        when: Tôi bật chỉnh sửa.
        then: >-
          Hộp thoại cảnh báo Assistant ghi thẳng vào workspace và không thể hoàn tác tự động, kèm
          nút cho phép chỉnh sửa.
      - given: Hộp thoại cảnh báo đang mở.
        when: Tôi hủy.
        then: Phiên vẫn chỉ đọc.
      - given: Hộp thoại cảnh báo đang mở.
        when: Tôi xác nhận.
        then: >-
          Phiên chuyển sang chế độ chỉnh sửa và hiển thị thông báo Assistant có thể đổi novel,
          chương và tri thức.
      - given: Phiên ở chế độ chỉnh sửa.
        when: Assistant sửa dữ liệu theo lệnh của tôi.
        then: Dữ liệu thay đổi và các màn hình liên quan trong ứng dụng hiển thị nội dung mới.
      - given: Phiên ở chế độ chỉnh sửa.
        when: Tôi tắt chỉnh sửa.
        then: Phiên trở lại chỉ đọc.

  # FEAT-39 Assistant Translation Review
  - id: US-0108
    feat: FEAT-39
    story: >-
      Là một content creator, tôi muốn nhờ Assistant rà soát chương đã dịch để phát hiện lỗi mà tôi
      khó thấy khi đọc.
    acceptance:
      - given: Chương đã có bản dịch.
        when: Tôi nhờ Assistant rà soát chương từ không gian dịch.
        then: >-
          Phiên chat mở với yêu cầu rà soát tên riêng, từ điển, nghĩa và các câu bị sót của chương
          đó.
      - given: Assistant rà soát xong.
        when: Tôi xem kết quả.
        then: >-
          Kết quả hiển thị số đoạn đã kiểm, số vấn đề, ngôn ngữ đích và các vấn đề theo mức độ lỗi,
          cảnh báo hoặc gợi ý cùng loại vấn đề.
      - given: Một vấn đề có đề xuất sửa.
        when: Tôi xem vấn đề.
        then: Tôi thấy bản dịch hiện tại cạnh đề xuất.

  - id: US-0109
    feat: FEAT-39
    story: >-
      Là một content creator, tôi muốn duyệt từng đề xuất của Assistant để chỉ áp dụng những gì tôi
      đồng ý.
    acceptance:
      - given: Kết quả rà soát có đề xuất sửa đoạn dịch.
        when: Tôi áp dụng một đề xuất.
        then: Đoạn dịch được sửa, đề xuất chuyển sang đã áp dụng và tiến độ xử lý cập nhật.
      - given: Kết quả rà soát đề xuất thêm thuật ngữ vào từ điển.
        when: Tôi chọn thêm vào từ điển.
        then: Thuật ngữ xuất hiện trong từ điển dịch của novel.
      - given: Có đề xuất chờ duyệt.
        when: Tôi bỏ qua một đề xuất.
        then: Đề xuất chuyển sang đã bỏ qua và bản dịch giữ nguyên.
      - given: Có nhiều đề xuất chờ duyệt.
        when: Tôi chọn áp dụng tất cả hoặc bỏ qua tất cả.
        then: >-
          Mọi đề xuất còn lại được xử lý, hệ thống thông báo số đề xuất và hiển thị đã xử lý hết.
      - given: Đoạn dịch đã bị sửa sau khi Assistant đề xuất.
        when: Tôi áp dụng đề xuất đó.
        then: Hệ thống báo đề xuất không còn áp dụng được và giữ nguyên bản dịch.

  # FEAT-40 Assistant Knowledge Fixes
  - id: US-0110
    feat: FEAT-40
    story: >-
      Là một content creator, tôi muốn nhờ Assistant đề xuất cách sửa xung đột tri thức để xử lý
      nhanh nhiều xung đột cùng lúc.
    acceptance:
      - given: Tri thức của novel có xung đột.
        when: Tôi nhờ Assistant sửa từ tab Rà soát.
        then: Phiên chat mở với yêu cầu đề xuất cách sửa đúng số xung đột đang có.
      - given: Assistant đã đề xuất.
        when: Tôi xem đề xuất.
        then: >-
          Đề xuất hiển thị số thay đổi và liệt kê từng thao tác (gộp, đổi tên, đổi loại, thêm, sửa,
          xóa, thuộc tính, bằng chứng) kèm giá trị trước và sau.

  - id: US-0111
    feat: FEAT-40
    story: >-
      Là một content creator, tôi muốn biết đề xuất có an toàn trước khi áp dụng để không tạo thêm
      xung đột.
    acceptance:
      - given: Đề xuất hợp lệ với ontology.
        when: Tôi xem đề xuất.
        then: Hệ thống báo hợp lệ và số xung đột sẽ được giải quyết.
      - given: Đề xuất sẽ tạo xung đột mới.
        when: Tôi xem đề xuất.
        then: >-
          Hệ thống báo số xung đột mới sẽ phát sinh và liệt kê chúng, nút áp dụng bị khóa và tôi chỉ
          bỏ qua được đề xuất.
      - given: Đề xuất đang chờ duyệt.
        when: Tôi áp dụng.
        then: Toàn bộ thay đổi được áp dụng một lần và tri thức hiển thị kết quả mới.
      - given: Đề xuất đang chờ duyệt.
        when: Tôi bỏ qua.
        then: Tri thức giữ nguyên và đề xuất chuyển sang đã bỏ qua.
