  <!-- Main layout -->
  <div id="app" class="app">
    <header class="titlebar">
      <img class="tb-logo" src="assets/dreamy-studio-mark.svg" alt="">
      <span class="tb-name">Dreamy Studio</span>
      <nav class="tb-menu" aria-label="Menu">
        <button class="tb-mi" data-act="app-menu" data-v="file">File</button>
        <button class="tb-mi" data-act="app-menu" data-v="view">View</button>
        <button class="tb-mi" data-act="app-menu" data-v="help">Help</button>
      </nav>
      <span class="spacer"></span>
      <button class="tb-ws" id="tb-ws" data-act="switch-workspace" data-tip="Đổi workspace" aria-label="Đổi workspace"></button>
      <span class="spacer"></span>
      <span class="tb-actions">
        <button class="btn btn-icon btn-sm" id="tg-explorer" data-act="toggle-explorer" data-tip="Explorer (Ctrl B)" aria-label="Toggle explorer"><svg class="ic"><use href="#i-panel-left"/></svg></button>
        <button class="btn btn-icon btn-sm" id="tg-bottom" data-act="toggle-bottom" data-tip="Pipelines (Ctrl J)" aria-label="Toggle bottom panel"><svg class="ic"><use href="#i-panel-bottom"/></svg></button>
        <button class="btn btn-icon btn-sm" id="tg-inspector" data-act="toggle-inspector" data-tip="Inspector (Ctrl Alt B)" aria-label="Toggle inspector"><svg class="ic"><use href="#i-panel-right"/></svg></button>
      </span>
    </header>

    <div class="shell" id="shell">
      <nav class="rail" id="rail" aria-label="Activity bar"></nav>
      <aside class="explorer" id="explorer" aria-label="Explorer"></aside>
      <div class="resizer" data-resize="explorer" role="separator" aria-orientation="vertical" aria-label="Điều chỉnh kích thước bảng Explorer" aria-valuenow="264" aria-valuemin="200" aria-valuemax="420" tabindex="0"></div>
      <main class="edcol" id="edcol">
        <div class="tabbar" id="tabbar" role="tablist"></div>
        <div class="crumbs" id="crumbs"></div>
        <section class="editor" id="editor"></section>
        <section class="bottom" id="bottom" aria-label="Bottom panel" hidden></section>
      </main>
      <div class="resizer" data-resize="inspector" role="separator" aria-orientation="vertical" aria-label="Điều chỉnh kích thước bảng Inspector" aria-valuenow="320" aria-valuemin="240" aria-valuemax="480" tabindex="0"></div>
      <aside class="inspector" id="inspector" aria-label="Inspector"></aside>
    </div>

    <footer class="statusbar" id="statusbar"></footer>
  </div>

  <div id="ld-overlay" class="ld-overlay" hidden data-testid="switch-loading-overlay"></div>
  <div id="layer"></div>
