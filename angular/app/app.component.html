<main class="container" data-testid="app-root">
  <header class="brand" data-testid="app-brand">
    <img src="/assets/dreamy-studio-mark.svg" class="logo" alt="Dreamy Studio" data-testid="app-logo" />
    <div>
      <h1>Dreamy Studio</h1>
      <p>Không gian sáng tạo nội dung của bạn</p>
    </div>
  </header>

  <form class="greeting-form" (submit)="greet($event, greetInput.value)" data-testid="greeting-form">
    <label for="greet-input">Thử kết nối với ứng dụng</label>
    <div class="row">
      <input #greetInput id="greet-input" placeholder="Tên của bạn" data-testid="greet-input" />
      <button type="submit" data-testid="greet-button">Chào</button>
    </div>
  </form>
  <p class="greeting-message" data-testid="greeting-message">{{ greetingMessage() }}</p>

  <router-outlet />
</main>
