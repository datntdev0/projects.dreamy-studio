<section class="ins-panel" data-testid="library-prompts-panel-content"><div class="ins-title" data-testid="library-prompts-panel-title">{{ 'library.prompt.title' | t }}</div><div class="stats" data-testid="library-prompts-panel-stats"><span data-testid="library-prompts-panel-count">{{ prompts.items().length }}</span><span data-testid="library-prompts-panel-size">{{ totalSize() }}</span><span data-testid="library-prompts-panel-limit">{{ limit }}</span></div><div class="row-actions" data-testid="library-prompts-panel-actions"><button data-testid="library-prompts-panel-upload" (click)="openUpload()"><ds-icon name="upload" [size]="14" data-testid="library-prompts-panel-upload-icon" />{{ 'library.prompt.upload' | t }}</button><button data-testid="library-prompts-panel-write" (click)="openWrite()"><ds-icon name="pen" [size]="14" data-testid="library-prompts-panel-write-icon" />{{ 'library.prompt.writeNew' | t }}</button></div><div class="row-badges" data-testid="library-prompts-panel-formats">@for (format of formats; track format) { <span class="tag" data-testid="library-prompts-panel-format">{{ format }}</span> }</div><div data-testid="library-prompts-panel-collections">@for (collection of collections(); track collection.id) { <button data-testid="library-prompts-panel-collection" (click)="openCollection(collection.id, collection.name)">{{ collection.name }} ({{ collection.counts.prompt }})</button> }</div></section>
