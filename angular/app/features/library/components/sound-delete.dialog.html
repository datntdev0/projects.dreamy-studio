@if (ids().length) { <ds-dialog [title]="titleKey() | t: { count: ids().length }" [closeLabel]="'library.soundDelete.close' | t" data-testid="library-sound-delete-dialog-panel" (closed)="close()"><div class="del-list" data-testid="library-sound-delete-dialog-list">@for (item of items(); track item.id) { <div class="del-row" data-testid="library-sound-delete-dialog-row"><ds-icon name="music" [size]="18" data-testid="library-sound-delete-dialog-icon" /><div data-testid="library-sound-delete-dialog-item"><div data-testid="library-sound-delete-dialog-name">{{ item.name }}</div><div class="t-sm t-mute" data-testid="library-sound-delete-dialog-meta">{{ 'library.kind.sound' | t }} · {{ size(item) }}</div></div></div> }</div><div class="ld-warn" data-testid="library-sound-delete-dialog-warning">{{ 'library.soundDelete.warning' | t }}</div><ds-button dialogFoot data-testid="library-sound-delete-dialog-cancel" (pressed)="close()">{{ 'library.soundDelete.cancel' | t }}</ds-button><ds-button dialogFoot variant="danger" [disabled]="busy()" data-testid="library-sound-delete-dialog-confirm" (pressed)="confirm()">{{ confirmKey() | t: { count: ids().length } }}</ds-button></ds-dialog> }
