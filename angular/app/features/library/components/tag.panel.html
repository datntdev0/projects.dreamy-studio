@if (row(); as item) {<section data-testid="library-tag-panel-content"><section class="ins-sec ins-form"><span class="eyebrow">{{ "library.tag" | t }}</span><div class="field"><label for="library-tag-name">{{ "library.tag.name" | t }}</label><input id="library-tag-name" class="input" maxlength="24" [value]="item.tag" data-testid="library-tag-panel-name" (change)="rename($event)" /><span class="field-hint">{{ "library.tag.renameHint" | t: { count: total(item) } }}</span></div>@if (library.tags().length > 1) {<div class="field"><label for="library-tag-merge">{{ "library.tag.mergeInto" | t }}</label><select id="library-tag-merge" class="select" data-testid="library-tag-panel-merge" (change)="merge($event)"><option value="">{{ "library.tag.choose" | t }}</option>@for (other of library.tags(); track other.tag) { @if (other.tag !== item.tag) {<option [value]="other.tag">{{ other.tag }}</option>} }</select></div>}</section><section class="ins-sec"><span class="eyebrow">{{ "library.tag.viewResources" | t }}</span>@for (kind of kinds; track kind.id) {<button type="button" class="nm-recent" [disabled]="count(item, kind.id) === 0" [attr.data-testid]="'library-tag-view-' + kind.id"><ds-icon [name]="kind.icon" [size]="16" /><span class="tree-label">{{ kind.labelKey | t }}</span><span class="mono t-mute">{{ count(item, kind.id) }}</span></button>}</section><section class="ins-sec ins-actions"><button type="button" class="btn btn-danger" data-testid="library-tag-panel-delete" (click)="delete()"><ds-icon name="trash" [size]="16" />{{ "library.tag.delete" | t }}</button></section></section>} @else {<div class="ins-empty" data-testid="library-tag-panel-missing"><p class="t-sm t-mute">{{ "library.tagsEmpty.title" | t }}</p></div>}
