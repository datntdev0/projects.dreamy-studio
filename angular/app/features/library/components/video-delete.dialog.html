@if (ids().length) {
  <ds-dialog [title]="titleKey() | t: { count: ids().length }" [closeLabel]="'library.videoDelete.close' | t" data-testid="library-video-delete-dialog-panel" (closed)="close()">
    <div class="del-list" data-testid="library-video-delete-dialog-list">
      @for (item of items(); track item.id) {
        <div class="del-row" data-testid="library-video-delete-dialog-row">
          <span class="lb-th is-ic is-md" data-testid="library-video-delete-dialog-thumb"><ds-icon name="film" [size]="18" data-testid="library-video-delete-dialog-icon" /></span>
          <div data-testid="library-video-delete-dialog-item">
            <div data-testid="library-video-delete-dialog-name">{{ item.name }}</div>
            <div class="t-sm t-mute" data-testid="library-video-delete-dialog-meta">{{ 'library.kind.video' | t }} · {{ size(item) }}</div>
          </div>
        </div>
      }
    </div>
    <div class="ld-warn" data-testid="library-video-delete-dialog-warning">{{ 'library.videoDelete.warning' | t }}</div>
    <ds-button dialogFoot data-testid="library-video-delete-dialog-cancel" (pressed)="close()">{{ 'library.videoDelete.cancel' | t }}</ds-button>
    <ds-button dialogFoot variant="danger" [disabled]="busy()" data-testid="library-video-delete-dialog-confirm" (pressed)="confirm()">{{ confirmKey() | t: { count: ids().length } }}</ds-button>
  </ds-dialog>
}
