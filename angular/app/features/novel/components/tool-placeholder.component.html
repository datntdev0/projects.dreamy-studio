@if (novel(); as novel) {
  <div class="nv" data-testid="novel-tool-placeholder">
    <div class="nv-bar" data-testid="novel-tool-placeholder-bar">
      <div class="nv-bar-l" data-testid="novel-tool-placeholder-bar-left">
        <span class="nv-ttl" data-testid="novel-tool-placeholder-title"><ds-cover size="xs" [image]="cover()" /><span class="t-ink">{{ nameOf(novel) }}</span><span class="badge">{{ novel.lang }}</span></span>
      </div>
    </div>
    <div class="nv-body" data-testid="novel-tool-placeholder-body">
      <div class="empty" data-testid="novel-tool-placeholder-empty"><div class="empty-inner"><div class="illus"></div><h4 class="t-display-xs" data-testid="novel-tool-placeholder-empty-title"><ds-icon [name]="icon()" [size]="18" /> {{ titleKey() | t }}</h4><p class="t-sm t-mute" data-testid="novel-tool-placeholder-empty-description">{{ descriptionKey() | t }}</p></div></div>
    </div>
  </div>
}
