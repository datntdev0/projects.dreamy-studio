<div class="app" [class.is-resizing-panels]="layout.resizing()" data-testid="main-page">
  <app-titlebar />
  <div class="shell" [style.--ex-w.px]="layout.explorerSize()" [style.--in-w.px]="layout.inspectorSize()" [class.no-explorer]="!layout.explorerOpen()" [class.no-inspector]="!layout.inspectorOpen()" data-testid="main-shell">
    <app-railbar />
    <app-explorer />
    <app-editor />
    <app-inspector />
  </div>
  <app-statusbar />
  @if (switchNotice(); as message) {
    <ds-toast class="main-notice" tone="danger" [message]="message" data-testid="main-switch-notice" (dismissed)="dismissSwitchNotice()" />
  }
  <app-switch-workspace-dialog />
  <app-novel-create-dialog />
  <app-novel-delete-dialog />
  <app-novel-chapter-add-dialog />
  <app-novel-chapter-delete-dialog />
  <app-novel-import-dialog />
  <app-project-create-dialog />
  <app-project-delete-dialog />
  <app-library-collection-dialog />
  <app-library-collection-delete-dialog />
  <app-library-upload-dialog />
  <app-library-image-preview-dialog />
  <app-library-image-delete-dialog />
  <app-library-sound-preview-dialog />
  <app-library-sound-delete-dialog />
  <app-library-video-preview-dialog />
  <app-library-video-delete-dialog />
  <app-library-prompt-preview-dialog />
  <app-library-prompt-delete-dialog />
  <app-library-tag-confirm-dialog />
  <app-toast-host />
</div>
