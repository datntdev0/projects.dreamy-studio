<button data-testid="button" class="btn" [class.btn-primary]="variant === 'primary'" [class.btn-ghost]="variant === 'ghost'" [class.btn-danger]="variant === 'danger'" [class.btn-sm]="size === 'small'" [class.btn-icon]="iconOnly" [class.btn-block]="block" [class.is-active]="active" [attr.type]="type" [attr.aria-label]="label || null" [disabled]="disabled" (click)="pressed.emit()"><ng-content /></button>
