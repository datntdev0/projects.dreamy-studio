<div class="table-wrap" data-testid="datatable"><table class="table"><thead><tr>@for (column of columns; track column.key) { <th scope="col" [class.num]="column.align === 'right'">{{ column.label }}</th> }</tr></thead><tbody>@for (row of rows; track $index) { <tr tabindex="0" [class.is-selected]="selectedIndex === $index" [attr.aria-selected]="selectedIndex === $index" (click)="select($index)" (keydown.enter)="select($index)" (keydown.space)="select($index); $event.preventDefault()">@for (column of columns; track column.key) { <td [class.num]="column.align === 'right'">{{ row[column.key] }}</td> }</tr> } @empty { <tr><td class="empty-cell" [attr.colspan]="columns.length">{{ emptyMessage }}</td></tr> }</tbody></table></div>
