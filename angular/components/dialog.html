<div class="scrim" data-testid="dialog-scrim"><div #panel class="modal dialog-panel" [class.modal-lg]="size === 'large'" [class.modal-xl]="size === 'xl'" role="dialog" aria-modal="true" tabindex="-1" [attr.aria-labelledby]="titleId" data-testid="dialog"><header class="modal-head dialog-head" data-testid="dialog-head"><div class="dialog-heading">@if (eyebrow) { <span class="eyebrow t-mute dialog-eyebrow" data-testid="dialog-eyebrow">{{ eyebrow }}</span> }<h2 class="dialog-title" [id]="titleId" data-testid="dialog-title">{{ title }}</h2></div><ds-button variant="ghost" size="small" [iconOnly]="true" [label]="closeLabel" data-testid="dialog-close" (pressed)="close()"><ds-icon name="x" [size]="16" /></ds-button></header><div class="modal-body dialog-body" data-testid="dialog-body"><ng-content /></div><div #foot class="modal-foot dialog-foot" data-testid="dialog-foot"><ng-content select="[dialogFoot]" /></div></div></div>
