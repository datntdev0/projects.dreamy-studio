<div class="field" data-testid="form" [class.is-checkbox]="kind() === 'checkbox'">
  @if (kind() === 'checkbox') {
  <label class="check">
    <input
      type="checkbox"
      [checked]="checked"
      [disabled]="disabled()"
      (change)="onChecked($event)"
    />
    {{ label() }}
  </label>
  } @else {
  <label [attr.for]="controlId">
    {{ label() }}@if (required()) {
    <span aria-hidden="true">*</span>
    }
  </label>
  @switch (kind()) { @case ('select') {
  <select
    class="select"
    [id]="controlId"
    [value]="value"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error || hint ? descriptionId : null"
    (change)="onValue($event)"
  >
    @for (option of options(); track option.value) {
    <option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</option>
    }
  </select>
  } @case ('textarea') {
  <textarea
    class="textarea"
    [id]="controlId"
    [value]="value"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error || hint ? descriptionId : null"
    (input)="onValue($event)"
  ></textarea>
  } @default {
  <input
    class="input"
    [class.is-invalid]="!!error"
    [id]="controlId"
    [type]="inputType()"
    [value]="value"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="error ? 'true' : null"
    [attr.aria-describedby]="error || hint ? descriptionId : null"
    (input)="onValue($event)"
  />
  } } } @if (error) {
  <span class="field-err" [id]="descriptionId">{{ error }}</span>
  } @else if (hint) {
  <span class="field-hint" [id]="descriptionId">{{ hint }}</span>
  }
</div>
