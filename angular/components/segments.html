<div class="seg" data-testid="segments" role="group" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
  <button
    type="button"
    [class.is-active]="value() === option.value"
    [attr.aria-pressed]="value() === option.value"
    [disabled]="option.disabled"
    (click)="select(option.value)"
  >
    {{ option.label }}
  </button>
  }
</div>
