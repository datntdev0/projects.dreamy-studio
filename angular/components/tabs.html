<div class="tabs" role="tablist" data-testid="tabs" [attr.aria-label]="label" (keydown)="onKeydown($event)">@for (option of options; track option.value) { <button type="button" class="tab" role="tab" [id]="tabId(option.value)" [class.is-active]="value === option.value" [attr.aria-selected]="value === option.value" [attr.aria-controls]="panelId(option.value)" [attr.tabindex]="value === option.value ? 0 : -1" [attr.data-testid]="'tab-' + option.value" [disabled]="option.disabled" (click)="select(option.value)">@if (option.icon) { <ds-icon [name]="option.icon" [size]="16" /> }<span>{{ option.label }}</span></button> }</div>
