<div class="asst-panel" [attr.data-view]="assistant.view()" data-testid="assistant-panel">
  @switch (assistant.view()) {
    @case ('sessions') {
      <app-assistant-sessions />
    }
    @case ('chat') {
      <app-assistant-chat />
    }
    @default {
      <app-assistant-start />
    }
  }
</div>
