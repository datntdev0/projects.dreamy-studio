@if (ctx().unit; as unit) {
  <div class="tl-sub is-wrap ab-sub" data-testid="ab-sub">
    <span class="mono t-mute sc-sub-n" data-testid="audiobook-subbar-number">
      {{ labels.unitNumber(ctx(), unit.no) }}
    </span>
    <span class="t-ink ab-sub-t" data-testid="audiobook-subbar-title">
      {{ labels.unitTitle(ctx(), unit.no, unit.title) }}
    </span>
  </div>
}
