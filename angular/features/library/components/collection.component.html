@if (collection(); as item) {
  <app-library-collection-assets [collectionId]="item.id" data-testid="library-collection-assets" />
} @else {
  <div class="empty" data-testid="library-collection-missing">
    <div class="empty-inner" data-testid="library-collection-missing-inner">
      <div class="illus" data-testid="library-collection-missing-illustration"></div>
      <h4 class="t-display-xs" data-testid="library-collection-missing-title">
        {{ 'library.collection.missing.title' | t }}
      </h4>
      <p class="t-sm t-mute" data-testid="library-collection-missing-description">
        {{ 'library.collection.missing.description' | t }}
      </p>
    </div>
  </div>
}
