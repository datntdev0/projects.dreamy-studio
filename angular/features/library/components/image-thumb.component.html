@if (variant() === 'row') {
  <span
    class="lb-th"
    [style.background]="background()"
    data-testid="library-image-thumb-row"
  ></span>
} @else {
  <span
    class="lb-media"
    [class.is-empty]="!source()"
    [style.background]="source() ? background() : null"
    data-testid="library-image-thumb-media"
  >
    @if (!source()) {
      <ds-icon name="image" [size]="32" data-testid="library-image-thumb-placeholder-icon" />
    }
    <span class="badge lb-ext" data-testid="library-image-thumb-extension">
      {{ image().ext.toUpperCase() }}
    </span>
  </span>
}
