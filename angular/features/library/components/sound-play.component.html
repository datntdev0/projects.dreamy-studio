<button
  type="button"
  class="lb-pbtn"
  [class.is-sm]="size() === 'sm'"
  [class.is-lg]="size() === 'lg'"
  [attr.aria-label]="label() | t"
  data-testid="library-sound-play-button"
  (click)="toggle($event)"
>
  <ds-icon
    [class.is-solid]="!isPlaying()"
    [name]="isPlaying() ? 'pause' : 'play'"
    [size]="size() === 'lg' ? 18 : size() === 'sm' ? 11 : 14"
    data-testid="library-sound-play-icon"
  />
</button>
