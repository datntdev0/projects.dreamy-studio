@if (row(); as item) {
<section data-testid="library-tag-panel-content">
  <section class="ins-sec ins-form" data-testid="library-tag-panel-form">
    <span class="eyebrow" data-testid="library-tag-panel-eyebrow">{{ "library.tag" | t }}</span>
    <div class="field" data-testid="library-tag-panel-name-field">
      <label for="library-tag-name" data-testid="library-tag-panel-name-label">
        {{ "library.tag.name" | t }}
      </label>
      <input
        id="library-tag-name"
        class="input"
        maxlength="24"
        [value]="item.tag"
        data-testid="library-tag-panel-name"
        (change)="rename($event)"
      />
      <span class="field-hint" data-testid="library-tag-panel-name-hint">
        {{ "library.tag.renameHint" | t: { count: total(item) } }}
      </span>
    </div>
    @if (library.tags().length > 1) {
    <div class="field" data-testid="library-tag-panel-merge-field">
      <label for="library-tag-merge" data-testid="library-tag-panel-merge-label">
        {{ "library.tag.mergeInto" | t }}
      </label>
      <select
        id="library-tag-merge"
        class="select"
        data-testid="library-tag-panel-merge"
        (change)="merge($event)"
      >
        <option value="" data-testid="library-tag-panel-merge-placeholder">
          {{ "library.tag.choose" | t }}
        </option>
        @for (other of library.tags(); track other.tag) { @if (other.tag !== item.tag) {
        <option [value]="other.tag" data-testid="library-tag-panel-merge-option">
          {{ other.tag }}
        </option>
        } }
      </select>
    </div>
    }
  </section>
  <section class="ins-sec" data-testid="library-tag-panel-resources">
    <span class="eyebrow" data-testid="library-tag-panel-resources-title">
      {{ "library.tag.viewResources" | t }}
    </span>
    @for (kind of kinds; track kind.id) {
    <button
      type="button"
      class="nm-recent"
      [disabled]="count(item, kind.id) === 0"
      [attr.data-testid]="'library-tag-panel-view-' + kind.id"
      (click)="viewResources(kind.id)"
    >
      <ds-icon [name]="kind.icon" [size]="16" data-testid="library-tag-panel-view-icon" />
      <span class="tree-label" data-testid="library-tag-panel-view-label">
        {{ kind.labelKey | t }}
      </span>
      <span class="mono t-mute" data-testid="library-tag-panel-view-count">
        {{ count(item, kind.id) }}
      </span>
    </button>
    }
  </section>
  <section class="ins-sec ins-actions" data-testid="library-tag-panel-actions">
    <button
      type="button"
      class="btn btn-danger"
      data-testid="library-tag-panel-delete"
      (click)="delete()"
    >
      <ds-icon name="trash" [size]="16" data-testid="library-tag-panel-delete-icon" />
      {{ "library.tag.delete" | t }}
    </button>
  </section>
</section>
} @else {
<div class="ins-empty" data-testid="library-tag-panel-missing">
  <p class="t-sm t-mute" data-testid="library-tag-panel-missing-text">
    {{ "library.tagsEmpty.title" | t }}
  </p>
</div>
}
