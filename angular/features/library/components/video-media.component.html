<div
  class="lb-media"
  [class.is-empty]="!poster()"
  [style.background-image]="poster() ? 'url(' + poster() + ')' : null"
  data-testid="library-video-media-content"
>
  @if (!poster()) {
    <ds-icon name="film" [size]="32" data-testid="library-video-media-placeholder" />
  }
  <span class="badge lb-ext" data-testid="library-video-media-duration">
    <span class="mono lb-dur" data-testid="library-video-media-duration-text">
      {{ duration() }}
    </span>
  </span>
</div>
