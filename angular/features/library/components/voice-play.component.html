@if (labelled()) {
  <button
    type="button"
    class="btn btn-sm lb-vo-play"
    [class.is-busy]="isPreparing()"
    [attr.aria-busy]="isPreparing()"
    [disabled]="disabled()"
    [attr.title]="disabled() ? hint() : null"
    [attr.aria-label]="label() | t"
    data-testid="library-voice-play-button"
    (click)="toggle($event)"
    (dblclick)="isolate($event)"
    (keydown.enter)="isolate($event)"
    (keydown.space)="isolate($event)"
  >
    <ds-icon [name]="iconName()" [size]="14" data-testid="library-voice-play-icon" />
    {{ caption() | t }}
  </button>
} @else {
  <button
    type="button"
    class="lb-pbtn"
    [class.is-sm]="size() === 'sm'"
    [class.is-lg]="size() === 'lg'"
    [class.is-busy]="isPreparing()"
    [attr.aria-busy]="isPreparing()"
    [disabled]="disabled()"
    [attr.title]="disabled() ? hint() : null"
    [attr.aria-label]="label() | t"
    data-testid="library-voice-play-button"
    (click)="toggle($event)"
    (dblclick)="isolate($event)"
    (keydown.enter)="isolate($event)"
    (keydown.space)="isolate($event)"
  >
    <ds-icon
      [class.is-solid]="!isPlaying() && !isPreparing()"
      [name]="iconName()"
      [size]="iconSize()"
      data-testid="library-voice-play-icon"
    />
  </button>
}
