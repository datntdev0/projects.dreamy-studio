@if (open()) {
  <ds-dialog [title]="'novel.chapters.add.title' | t" [eyebrow]="'novel.cap' | t" [closeLabel]="'novel.dialog.close' | t" data-testid="novel-chapter-add-dialog-panel" (closed)="close()">
    <div class="field" data-testid="novel-chapter-add-field">
      <label for="ch-new-title">{{ "novel.chapters.add.field" | t }}</label>
      <input #titleInput id="ch-new-title" class="input" [placeholder]="'novel.chapters.add.placeholder' | t: { n: nextSeq() }" [value]="title()" autocomplete="off" data-testid="novel-chapter-add-title" (input)="onInput($event)" (keydown.enter)="submit()" />
      <span class="field-hint" data-testid="novel-chapter-add-hint">{{ "novel.chapters.add.hint" | t }}</span>
    </div>
    <ds-button dialogFoot data-testid="novel-chapter-add-cancel" (pressed)="close()">{{ "common.cancel" | t }}</ds-button>
    <ds-button dialogFoot variant="primary" [disabled]="busy()" data-testid="novel-chapter-add-submit" (pressed)="submit()"><ds-icon name="plus" [size]="16" />{{ "novel.chapters.add.submit" | t }}</ds-button>
  </ds-dialog>
}
