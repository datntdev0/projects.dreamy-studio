<span
  [class.pj-th]="kind() === 'th'"
  [class.is-xs]="kind() === 'th' && size() === 'xs'"
  [class.is-md]="kind() === 'th' && size() === 'md'"
  [class.pj-thumb]="kind() === 'card'"
  [class.pj-ins-thumb]="kind() === 'hero'"
  [class.is-empty]="!image()"
  [class]="tone()"
  [style.background]="background()"
  data-testid="project-thumb"
>
  @if (!image()) {
    <span class="cover-ph pj-mono" aria-hidden="true" data-testid="project-thumb-monogram">
      {{ monogram() }}
    </span>
  }
  <ng-content></ng-content>
</span>
