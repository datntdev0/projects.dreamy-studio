@if (showKb()) {
  @if (!ctx().kb.novel) {
    <div class="sc-ban is-info" data-testid="sc-ban-kb">
      <ds-icon name="info" [size]="16" />
      <span>{{ 'scripting.editor.ban.noNovel' | t }}</span>
    </div>
  } @else if (!ctx().kb.available) {
    <div class="sc-ban is-info" data-testid="sc-ban-kb">
      <ds-icon name="info" [size]="16" />
      <span>{{ 'scripting.editor.ban.noKb' | t }}</span>
    </div>
  } @else if (ctx().kb.missing.length > 0) {
    <div class="sc-ban is-warn" data-testid="sc-ban-kb">
      <ds-icon name="alert" [size]="16" />
      <span>{{ 'scripting.editor.ban.missingKb' | t: { chapters: missing() } }}</span>
      <button
        type="button"
        class="btn btn-sm"
        data-testid="sc-open-kb-btn"
        (click)="openKnowledge()"
      >
        <ds-icon name="graph" [size]="16" />
        {{ 'scripting.editor.ban.openKb' | t }}
      </button>
    </div>
  }
}
