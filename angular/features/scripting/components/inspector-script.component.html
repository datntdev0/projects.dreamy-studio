<section class="ins-sec sc-ins-script" data-testid="sc-ins-script">
  <span class="eyebrow" data-testid="scripting-inspector-script-title">
    {{ 'scripting.inspector.script' | t }}
  </span>
  @if (ctx().hasDefault) {
    <button type="button" class="btn btn-block" data-testid="sc-reset-btn" (click)="reset()">
      <ds-icon name="refresh" [size]="16" />
      {{ 'scripting.inspector.reset' | t }}
    </button>
  }
  <button
    type="button"
    class="btn btn-block"
    [class.btn-primary]="ctx().locked"
    data-testid="sc-next-btn"
    (click)="openNext(next().id)"
  >
    <ds-icon [name]="next().icon" [size]="16" />
    {{ 'scripting.inspector.next' | t: { module: (next().labelKey | t) } }}
  </button>
  @if (!ctx().locked) {
    <span class="field-hint" data-testid="scripting-inspector-script-hint">
      {{ 'scripting.inspector.lockHint' | t: { unit: labels.unit(ctx().config) } }}
    </span>
  }
</section>
