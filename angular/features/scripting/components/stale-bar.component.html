<div class="sc-stale" [attr.data-testid]="'sc-stale-' + reference()">
  <ds-icon name="alert" [size]="15" />
  <div class="sc-stale-b">
    <b>{{ 'scripting.editor.stale.title' | t }}</b>
    <div class="t-sm t-mute">
      <span class="sc-was">{{ 'scripting.editor.stale.before' | t }}</span>
      {{ before() }}
    </div>
    <div class="t-sm">
      <span class="sc-was">{{ 'scripting.editor.stale.now' | t }}</span>
      {{ now() }}
    </div>
  </div>
  <div class="sc-stale-a" data-testid="scripting-stale-actions">
    <button
      type="button"
      class="btn btn-sm"
      [disabled]="ctx().locked"
      [attr.title]="ctx().locked ? ('scripting.editor.stale.unlock' | t) : null"
      [attr.data-testid]="'sc-regen-' + reference()"
      (click)="regenerate()"
    >
      <ds-icon name="refresh" [size]="16" />
      {{ 'scripting.editor.stale.regenerate' | t }}
    </button>
    <button
      type="button"
      class="btn btn-sm btn-ghost"
      [disabled]="ctx().locked"
      [attr.data-testid]="'sc-keep-' + reference()"
      (click)="keep()"
    >
      {{ 'scripting.editor.stale.keep' | t }}
    </button>
  </div>
</div>
