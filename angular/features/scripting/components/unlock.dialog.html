@if (open() && ctx()) {
<ds-dialog
  [title]="'scripting.dialog.unlock.title' | t: { unit: unitName(), no: unitNo() }"
  [eyebrow]="'scripting.dialog.cap' | t"
  [closeLabel]="'scripting.dialog.close' | t"
  data-testid="sc-unlock-modal"
  (closed)="close()"
>
  <p class="t-sm" data-testid="scripting-unlock-body">
    {{ "scripting.dialog.unlock.body" | t: { unit: unitTitle() } }}
  </p>
  @if (downstream()) {
  <div class="sc-ban is-warn" data-testid="scripting-unlock-banner">
    <ds-icon name="alert" [size]="16" />
    <span>{{ "scripting.dialog.unlock.warn" | t }}</span>
  </div>
  }
  <ds-button dialogFoot data-testid="sc-unlock-cancel-btn" (pressed)="close()">
    {{ "common.cancel" | t }}
  </ds-button>
  <ds-button dialogFoot variant="primary" data-testid="sc-unlock-ok-btn" (pressed)="confirm()">
    <ds-icon name="unlock" [size]="14" />
    {{ "scripting.dialog.unlock.ok" | t }}
  </ds-button>
</ds-dialog>
}
