@if (open()) {
<ds-dialog
  [title]="'settings.title' | t"
  [eyebrow]="'settings.cap' | t"
  [closeLabel]="'settings.close' | t"
  size="xl"
  data-testid="settings-dialog-panel"
  (closed)="close()"
>
  <div class="settings st-layout" data-testid="settings-content">
    <nav
      class="settings-nav"
      [attr.aria-label]="'settings.nav.label' | t"
      data-testid="settings-nav"
    >
      @for (item of sections; track item.id) {
      <button
        type="button"
        class="tree-row"
        [class.is-selected]="item.id === current().id"
        [attr.aria-current]="item.id === current().id ? 'page' : null"
        [attr.data-testid]="'settings-nav-' + item.id"
        (click)="select(item.id)"
      >
        <ds-icon [name]="item.icon" [size]="16" />
        <span class="tree-label">{{ item.labelKey | t }}</span>
      </button>
      }
    </nav>
    <div class="settings-pane" [attr.data-testid]="'settings-pane-' + current().id">
      @if (current().id === "general") {
      <app-settings-general />
      } @else if (current().id === "llm") {
      <app-settings-llm />
      } @else if (current().id === "backend") {
      <app-settings-backend />
      } @else if (current().id === "remote") {
      <app-settings-remote />
      } @else {
      <app-settings-cloud />
      }
    </div>
  </div>
</ds-dialog>
}
