<app-steps-card [view]="view()" data-testid="loading-card">
  @if (failed()) {
    <ds-button variant="ghost" size="small" data-testid="loading-back" (pressed)="back()">
      <ds-icon name="arrow-left" [size]="14" />
      {{ 'open.back' | t }}
    </ds-button>
    <ds-button variant="primary" size="small" data-testid="loading-retry" (pressed)="retry()">
      <ds-icon name="refresh" [size]="14" />
      {{ 'setup.retry' | t }}
    </ds-button>
  } @else {
    <ds-button variant="ghost" size="small" data-testid="loading-cancel" (pressed)="cancel()">
      {{ 'common.cancel' | t }}
    </ds-button>
  }
</app-steps-card>
