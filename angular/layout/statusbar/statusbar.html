<footer class="statusbar" data-testid="statusbar">
  @if (workspace(); as ws) {
    <span class="sb-item" [attr.title]="ws.path" data-testid="statusbar-workspace"><ds-icon name="hdd" [size]="14" /><span class="path">{{ ws.path }}</span></span>
  }
  <span class="spacer"></span>
  <button type="button" class="sb-item" [attr.aria-label]="'main.titlebar.toggleBottom' | t" [attr.title]="'main.titlebar.toggleBottom' | t" data-testid="statusbar-pipelines" (click)="layout.toggleBottom()"><ds-icon name="activity" [size]="14" /><span class="mono">{{ "main.statusbar.pipelinesIdle" | t }}</span></button>
  @if (info(); as app) {
    <span class="sb-item mono" data-testid="statusbar-version">V{{ app.version }}</span>
  }
</footer>
