<div class="app" [class.is-resizing-panels]="layout.resizing()" data-testid="main-page">
  <app-titlebar />
  <div
    class="shell"
    [style.--ex-w.px]="layout.explorerSize()"
    [style.--in-w.px]="layout.inspectorSize()"
    [class.no-explorer]="!layout.explorerVisible()"
    [class.no-inspector]="!layout.inspectorOpen()"
    data-testid="main-shell"
  >
    <app-railbar />
    <app-explorer />
    <app-editor />
    <app-inspector />
  </div>
  <app-statusbar />
  @if (switchNotice(); as message) {
  <ds-toast
    class="main-notice"
    tone="danger"
    [message]="message"
    data-testid="main-switch-notice"
    (dismissed)="dismissSwitchNotice()"
  />
  }
  <app-settings-dialog />
  <app-switch-workspace-dialog />
  <app-novel-create-dialog />
  <app-novel-chapter-add-dialog />
  <app-novel-import-dialog />
  <app-novel-knowledge-analyze-dialog />
  <app-novel-translation-run-dialog />
  <app-novel-knowledge-edit-dialog />
  <app-project-create-dialog />
  <app-library-collection-dialog />
  <app-library-upload-dialog />
  <app-library-image-preview-dialog />
  <app-library-sound-preview-dialog />
  <app-library-video-preview-dialog />
  <app-library-prompt-preview-dialog />
  <app-dialog-host />
  <app-toast-host />
</div>
