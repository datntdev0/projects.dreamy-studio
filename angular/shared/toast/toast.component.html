@if (visible) {
  <div
    class="toast"
    data-testid="toast"
    [class.is-success]="tone() === 'success'"
    [class.is-warning]="tone() === 'warning'"
    [class.is-danger]="tone() === 'danger'"
    [class.is-info]="tone() === 'info'"
    [attr.role]="tone() === 'danger' ? 'alert' : 'status'"
  >
    <span class="dot" aria-hidden="true"></span>
    <span class="message">{{ message() }}</span>
    @if (dismissible()) {
      <button type="button" class="close" aria-label="Dismiss notification" (click)="dismiss()">
        <ds-icon name="x" [size]="14" />
      </button>
    }
  </div>
}
