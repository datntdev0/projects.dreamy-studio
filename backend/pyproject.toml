[project]
name = "dreamy-studio-backend"
version = "0.1.2"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "huggingface_hub>=2.4,<3",
]

[project.optional-dependencies]
package = ["pyinstaller>=6.21,<7"]
dev = ["ruff>=0.17.4,<0.18", "coverage>=7.17,<8", "pytest>=9,<10"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.shared.resources" = ["catalog.json", "runtimes/*/*.json"]
