[package]
name = "dreamy-studio"
version = "0.0.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
include_dir = "0.7.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23.1"
uuid = { version = "1.29.2", features = ["v4"] }
sha2 = "0.10"
serde_yaml_ng = "0.10"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "aac", "pcm"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 3

[dev-dependencies]
tempfile = "3.27.0"
